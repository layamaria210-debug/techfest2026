<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organizer Dashboard - TECHFEST 2026</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .completed-task { text-decoration: line-through; color: #f0eaeafb; }
        .dashboard-section { margin: 20px auto; max-width: 900px; text-align: left; }
    </style>
</head>
<body>
    <div align="center">
        <h1>Organizer Dashboard</h1>
    </div>
    <div class="dashboard-section">
        <h2>Registered Participants (Total: <span id="totalCount">0</span>)</h2>
        <button id="clearAllBtn">Clear All Participants</button>
        <br><br>
        <div style="overflow-x: auto;">
            <table border="1" cellpadding="8" cellspacing="0" width="100%">
                <thead>
                    <tr>
                        <th>No.</th>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Phone</th>
                        <th>DOB</th>
                        <th>Gender</th>
                        <th>Events</th>
                        <th>Department</th>
                        <th>Message</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="registrationTable"></tbody>
            </table>
        </div>
    </div>
    <hr>
    <div class="dashboard-section">
        <h2>Organizer Task Manager</h2>
        <input type="text" id="taskInput" placeholder="Enter a new task...">
        <button id="addTaskBtn">Add Task</button>
        <ul id="taskList"></ul>
    </div>
    <script defer src="js/app.js"></script>
</body>
</html>
